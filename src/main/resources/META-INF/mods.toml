# Phayriosis: Cataclysm - An addon mod for Phayriosis Reborn
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Phayriosis: Cataclysm"
authors = "Alku"
description = '''
An addon mod for Phayriosis Reborn that adds advanced infection mechanics:

• Biomass-Driven Stage Progression: The infection grows stronger as it consumes life.
• Spore Artillery Towers: Automated infection bombardment of safe areas.
• Deep Root Network: Underground infection spread that accelerates surface corruption.
• Water Contamination: Infection spreads through waterways.
• Siege AI: Infection mobs break through walls and defenses.
• Battlefield Merging: Small larvae fuse into massive horrors if left unchecked.
• Call Swarm: Mobs alert the horde, triggering coordinated rushes.
• Adaptive Carapace: High-tier infection mobs develop resistance to repeated damage types.
• Hemolysis: Mobs that keep attacking a target their blows cannot hurt inject a stacking toxin
  that deals unresistable true damage every second.
• Metamorphosis: every attack a low-tier PHA creature lands (under 40 max health) has a 30%
  chance to turn the attacker into an abominable unit - humanoids into the Abominable Human,
  beasts into the Abominable Bear, endermen and water creatures into their own abominable forms.
• Meteor Strike: every 20 seconds a Dreadmind calls a meteor of random molten blocks down on an
  enemy elite unit (40+ max health). The impact deals 50 damage and stuns everything of another
  faction inside its radius for 50 seconds, and leaves a shallow crater behind (all values
  configurable: cooldown, elite health, damage, stun duration, block list, crater size).
• Targeting Range: every PHA creature hunts with a 64 block sight range (configurable).
• Holy Empowerment: every 30 seconds a Dreadmind blesses 3 nearby units - 150% attributes,
  golden aura, marked victims take growing PHA damage and all PHA damage against them is true
  damage (all values configurable).
• PHA Infighting: with both Phayriosis versions installed, creatures of different PHA mods never
  target or damage each other (scope configurable: cross-mod / all PHA / off).
• PHA Damage Cap: one hit can take at most 20 health (10 hearts) off a PHA creature, however
  large the blow was - armour piercing, criticals and true damage included (ceiling and
  per-damage-type exceptions configurable).
• Simplified-Chinese localization of the whole Phayriosis family (all 5829 keys of both
  "Phayriosis 1.3.x" and "Phayriosis Reborn 0.3.x"); it applies when the game language is Chinese.
'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "phayriosisreborn"
mandatory = true
versionRange = "[0.3.0,)"
ordering = "AFTER"
side = "BOTH"
