# Phayriosis: Cataclysm - An addon mod for Phayriosis Reborn
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Phayriosis: Cataclysm"
authors = "Alku"
description = '''
An addon mod for Phayriosis Reborn that adds advanced infection mechanics:

• Biomass-Driven Stage Progression: The infection grows stronger as it consumes life.
• Spore Artillery Towers: Automated infection bombardment of safe areas.
• Deep Root Network: Underground infection spread that accelerates surface corruption.
• Water Contamination: Infection spreads through waterways.
• Siege AI: Infection mobs break through walls and defenses.
• Battlefield Merging: Small larvae fuse into massive horrors if left unchecked.
• Call Swarm: Mobs alert the horde, triggering coordinated rushes.
• Adaptive Carapace: High-tier infection mobs develop resistance to repeated damage types.
'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "phayriosisreborn"
mandatory = true
versionRange = "[0.3.0,)"
ordering = "AFTER"
side = "BOTH"
